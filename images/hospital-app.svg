<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hospBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#075985;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#hospBg)"/>
  
  <!-- Pattern dots -->
  <circle cx="50" cy="50" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="150" cy="80" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="550" cy="60" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="450" cy="350" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="100" cy="320" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="520" cy="280" r="2" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Main Dashboard Card -->
  <rect x="80" y="60" width="440" height="280" rx="16" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" opacity="0.95"/>
  
  <!-- Header bar -->
  <rect x="80" y="60" width="440" height="45" rx="16" fill="#1e293b"/>
  <rect x="80" y="85" width="440" height="20" fill="#1e293b"/>
  
  <!-- App title -->
  <circle cx="110" cy="82" r="12" fill="#ef4444"/>
  <text x="106" y="87" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">+</text>
  <text x="135" y="86" fill="#fff" font-size="14" font-family="sans-serif" font-weight="bold">MediCare</text>
  
  <!-- Status indicator -->
  <circle cx="480" cy="82" r="6" fill="#10b981"/>
  <text x="465" y="86" text-anchor="end" fill="#94a3b8" font-size="9" font-family="sans-serif">Live</text>
  
  <!-- Stats Cards Row -->
  <!-- Patients Card -->
  <rect x="100" y="120" width="120" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="120" cy="140" r="8" fill="#3b82f6" opacity="0.2"/>
  <text x="135" y="143" fill="#fff" font-size="11" font-family="sans-serif" font-weight="600">Patients</text>
  <text x="120" y="168" fill="#3b82f6" font-size="20" font-family="sans-serif" font-weight="bold">1,284</text>
  <text x="120" y="182" fill="#64748b" font-size="8" font-family="sans-serif">+12% this week</text>
  
  <!-- Doctors Card -->
  <rect x="230" y="120" width="120" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="250" cy="140" r="8" fill="#10b981" opacity="0.2"/>
  <text x="265" y="143" fill="#fff" font-size="11" font-family="sans-serif" font-weight="600">Doctors</text>
  <text x="250" y="168" fill="#10b981" font-size="20" font-family="sans-serif" font-weight="bold">56</text>
  <text x="250" y="182" fill="#64748b" font-size="8" font-family="sans-serif">8 on duty</text>
  
  <!-- Appointments Card -->
  <rect x="360" y="120" width="120" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="380" cy="140" r="8" fill="#f59e0b" opacity="0.2"/>
  <text x="395" y="143" fill="#fff" font-size="11" font-family="sans-serif" font-weight="600">Today Appts</text>
  <text x="380" y="168" fill="#f59e0b" font-size="20" font-family="sans-serif" font-weight="bold">42</text>
  <text x="380" y="182" fill="#64748b" font-size="8" font-family="sans-serif">Next: 2:30 PM</text>
  
  <!-- Heart Rate Monitor -->
  <rect x="100" y="205" width="250" height="60" rx="8" fill="#0f172a"/>
  <polyline points="110,240 130,240 140,230 150,250 160,220 170,240 180,235 190,245 200,225 210,240 230,240 240,230 250,245 260,240 280,240" 
            fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="220" fill="#10b981" font-size="9" font-family="sans-serif">❤️ BPM: 72</text>
  
  <!-- Schedule List -->
  <rect x="360" y="205" width="140" height="60" rx="8" fill="#0f172a"/>
  <text x="375" y="222" fill="#94a3b8" font-size="8" font-family="sans-serif">Next Schedule</text>
  <rect x="375" y="230" width="6" height="6" rx="1" fill="#3b82f6"/>
  <text x="387" y="236" fill="#fff" font-size="8" font-family="sans-serif">10:00 Checkup</text>
  <rect x="375" y="242" width="6" height="6" rx="1" fill="#10b981"/>
  <text x="387" y="248" fill="#fff" font-size="8" font-family="sans-serif">11:30 Surgery</text>
  
  <!-- Bottom Navigation -->
  <rect x="100" y="280" width="400" height="45" rx="8" fill="#0f172a"/>
  <rect x="110" y="290" width="25" height="25" rx="5" fill="#3b82f6" opacity="0.2"/>
  <text x="122" y="307" text-anchor="middle" fill="#3b82f6" font-size="12">⌂</text>
  <text x="122" y="325" text-anchor="middle" fill="#3b82f6" font-size="7" font-family="sans-serif">Home</text>
  
  <rect x="170" y="290" width="25" height="25" rx="5" fill="#1e293b"/>
  <text x="182" y="307" text-anchor="middle" fill="#64748b" font-size="12">📋</text>
  <text x="182" y="325" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Records</text>
  
  <rect x="230" y="290" width="25" height="25" rx="5" fill="#1e293b"/>
  <text x="242" y="307" text-anchor="middle" fill="#64748b" font-size="12">💊</text>
  <text x="242" y="325" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Pharmacy</text>
  
  <rect x="290" y="290" width="25" height="25" rx="5" fill="#1e293b"/>
  <text x="302" y="307" text-anchor="middle" fill="#64748b" font-size="12">📅</text>
  <text x="302" y="325" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Calendar</text>
  
  <rect x="350" y="290" width="25" height="25" rx="5" fill="#1e293b"/>
  <text x="362" y="307" text-anchor="middle" fill="#64748b" font-size="12">👤</text>
  <text x="362" y="325" text-anchor="middle" fill="#64748b" font-size="7" font-family="sans-serif">Profile</text>
  
  <!-- Floating notification badge -->
  <circle cx="510" cy="290" r="10" fill="#ef4444"/>
  <text x="510" y="295" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">3</text>
</svg>