<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#166534;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8956e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  
  <!-- Stadium lights -->
  <circle cx="100" cy="40" r="8" fill="#fbbf24" opacity="0.8"/>
  <circle cx="500" cy="40" r="8" fill="#fbbf24" opacity="0.8"/>
  <circle cx="300" cy="20" r="10" fill="#fbbf24" opacity="0.9"/>
  <line x1="100" y1="40" x2="100" y2="80" stroke="#6b7280" stroke-width="3"/>
  <line x1="500" y1="40" x2="500" y2="80" stroke="#6b7280" stroke-width="3"/>
  <line x1="300" y1="20" x2="300" y2="70" stroke="#6b7280" stroke-width="3"/>
  
  <!-- Oval field -->
  <ellipse cx="300" cy="280" rx="220" ry="100" fill="url(#fieldGrad)"/>
  
  <!-- Pitch -->
  <rect x="280" y="180" width="40" height="140" rx="3" fill="url(#pitchGrad)"/>
  
  <!-- Crease lines -->
  <line x1="275" y1="200" x2="325" y2="200" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <line x1="275" y1="300" x2="325" y2="300" stroke="#fff" stroke-width="1" opacity="0.6"/>
  
  <!-- Stumps -->
  <rect x="288" y="195" width="3" height="20" fill="#f5f5dc"/>
  <rect x="295" y="195" width="3" height="20" fill="#f5f5dc"/>
  <rect x="302" y="195" width="3" height="20" fill="#f5f5dc"/>
  <rect x="287" y="193" width="20" height="2" fill="#dc2626"/>
  
  <!-- Batsman silhouette -->
  <g transform="translate(320, 220)">
    <circle cx="0" cy="-25" r="8" fill="#1f2937"/>
    <rect x="-4" y="-18" width="8" height="20" rx="2" fill="#1f2937"/>
    <rect x="-8" y="-5" width="16" height="3" rx="1" fill="#1f2937"/>
    <line x1="5" y1="-15" x2="20" y2="-25" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bowler silhouette -->
  <g transform="translate(260, 160)">
    <circle cx="0" cy="-15" r="6" fill="#1f2937"/>
    <rect x="-3" y="-10" width="6" height="14" rx="2" fill="#1f2937"/>
    <line x1="0" y1="-12" x2="10" y2="-20" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Ball in air -->
  <circle cx="275" cy="175" r="5" fill="url(#ballGrad)"/>
  <path d="M 280 175 Q 285 173 290 175" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.5"/>
  
  <!-- Scoreboard -->
  <rect x="380" y="100" width="120" height="70" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="120" text-anchor="middle" fill="#3b82f6" font-size="10" font-family="monospace">T20 CRICKET</text>
  <text x="440" y="140" text-anchor="middle" fill="#fff" font-size="18" font-family="monospace" font-weight="bold">187/4</text>
  <text x="440" y="158" text-anchor="middle" fill="#9ca3af" font-size="9" font-family="monospace">18.3 OVERS</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="350" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="550" cy="350" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="530" cy="150" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="70" cy="150" r="2" fill="#fbbf24" opacity="0.6"/>
</svg>